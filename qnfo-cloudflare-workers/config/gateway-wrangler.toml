# wrangler.toml — qnfo-gateway deploy config (per cloudflare skill KIF-50)
# Deploy: wrangler deploy --config config/gateway-wrangler.toml
# Secrets (SYNC_TOKEN, TURNSTILE_SECRET) persist via `wrangler secret put` —
# NOT declared here (wrangler preserves existing secrets across deploys).

name = "qnfo-gateway"
main = "../qnfo-gateway.js"
compatibility_date = "2025-07-17"

ai = { binding = "AI" }

[[d1_databases]]
binding = "DB"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING_PAPER"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[r2_buckets]]
binding = "QNFO_BUCKET"
bucket_name = "qnfo"
