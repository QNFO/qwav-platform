name = "qnfo-email"
main = "qnfo-email.js"
compatibility_date = "2026-08-03"
workers_dev = true

# UNRESTRICTED send binding — can send to any verified destination address
# (no destination_address / allowed_destination_addresses restriction)
[[send_email]]
name = "SEND_EMAIL"

# Custom domain route — eliminates workers.dev Bot Fight Mode (1010 errors)
# Routes /email/* on qnfo.org to this Worker
# Bot Fight Mode disabled on qnfo.org zone (browser_check: off, 2026-08-06)
# Zone ID: 84e9dc1d7fb72629ccdbe3174ed24420
[[routes]]
pattern = "qnfo.org/email/*"
zone_id = "84e9dc1d7fb72629ccdbe3174ed24420"

# NOTE: [[email_routing]] binding is silently dropped by Workers API.
# Actual routing is handled by Cloudflare Dashboard Email Routing rules:
#   rowan.quni@qnfo.org, publications@qnfo.org, alerts@qnfo.org,
#   research@qnfo.org, qnfo@qnfo.org → worker:qnfo-email
#   Catch-all: forward → qnfo@qnfo.org
# Verify with: wrangler email routing rules list qnfo.org
# [[email_routing]]
# name = "INBOUND"
# destination_address = "qnfo@qnfo.org"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[vars]
NOTIFY_WEBHOOK = ""
API_KEY = "DOBeIKHIFjNGLsoTl-KhS9XBcfW8kL-zJ09X7EePDto"
